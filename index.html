<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Dental Tracker"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Dental Tracker</title><style>
:root{color-scheme:light dark;--bg:#f3f5f9;--surface:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb;--soft:#eaf1ff;--danger:#dc2626;--warning:#b45309;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}header b{font-size:21px}header small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}main{max-width:760px;margin:auto;padding:16px 14px calc(100px + env(safe-area-inset-bottom))}nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 4px calc(9px + env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:none;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:5px;flex-direction:column;min-width:65px}nav button.active{color:var(--accent);font-weight:700}nav span{font-size:22px}.btn{background:var(--accent);color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:650}.btn.alt{background:var(--soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.danger{background:#fee2e2;color:#b91c1c}.small{font-size:12px;padding:8px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin:10px 0}.muted{color:var(--muted)}h2{font-size:22px;margin:4px 0 16px}h3{font-size:17px;margin:5px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{margin:0;padding:12px}.stats strong{display:block;font-size:23px;margin-top:6px}.pill{display:inline-block;border-radius:100px;padding:5px 9px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700}.pill.red{background:#fee2e2;color:#b91c1c}.pill.orange{background:#fef3c7;color:#92400e}.pill.green{background:#dcfce7;color:#166534}.pill.blue{background:#dbeafe;color:#1d4ed8}.order{border-left:5px solid var(--accent)}.order.red{border-left-color:#dc2626}.order.orange{border-left-color:#f59e0b}.order.green{border-left-color:#16a34a}.order.blue{border-left-color:#3b82f6}input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px;margin:5px 0 12px}label{display:block;font-size:13px;font-weight:650;margin-top:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.hide{display:none!important}.section{margin-top:20px}.line{height:1px;background:var(--border);margin:14px 0}.right{text-align:right}.total{font-size:22px;font-weight:750}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{border:0;border-radius:18px;background:var(--surface);color:var(--text);width:min(94vw,660px);max-height:88vh;overflow:auto;padding:18px}dialog::backdrop{background:#0f172aa8}.itemline{border:1px solid var(--border);border-radius:12px;padding:10px;margin:10px 0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:left}td.num,th.num{text-align:right}.notice{background:var(--soft);border-radius:12px;padding:12px;margin:10px 0;font-size:13px}.warning{background:#fef3c7;color:#78350f}.searchbar{margin:0 0 12px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin-top:5px}.tap{cursor:pointer}@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--surface:#182233;--text:#f1f5f9;--muted:#9aaac0;--border:#334155;--soft:#1d3559;--accent:#76a8ff}.pill.red{background:#4a1f28;color:#ffb4b4}.pill.orange{background:#453416;color:#ffd38a}.pill.green{background:#143d2b;color:#a1efbc}.pill.blue{background:#1b3556;color:#a5caff}.btn.danger{background:#4a1f28;color:#ffb4b4}.warning{background:#47351a;color:#ffdf9c}}@media print{header,nav,.noprint{display:none!important}main{padding:0}body{background:white;color:black}.card{break-inside:avoid}}
</style></head><body><header><div><small>DENTAL TRACKER</small><b id="headerTitle">Мои работы</b></div><button class="btn small" id="addBtn">+ Заказ</button></header><main id="app"></main><nav id="nav"><button data-tab="works" class="active"><span>▤</span>Работы</button><button data-tab="doctors"><span>♙</span>Врачи</button><button data-tab="reports"><span>▥</span>Отчёты</button><button data-tab="settings"><span>⚙</span>Настройки</button></nav><dialog id="dlg"><div id="dialogBody"></div></dialog><script>
'use strict';
const DB='dental-tracker-v1';let db,state={tab:'works',doctor:'',search:'',reportDate:new Date().toISOString().slice(0,10),reportDoctor:'',reportKind:'period',reportPaid:'all'};const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const dateLocal=d=>{let x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const today=()=>dateLocal(new Date());const nice=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU'):'';const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random();const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);const all=s=>new Promise((res,rej)=>{let r=tx(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const put=(s,x)=>new Promise((res,rej)=>{let r=tx(s,'readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});const del=(s,k)=>new Promise((res,rej)=>{let r=tx(s,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});const get=(s,k)=>new Promise((res,rej)=>{let r=tx(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});let data={orders:[],doctors:[],patients:[],types:[],overrides:[],snapshots:[],settings:[]};async function reload(){for(let s of Object.keys(data))data[s]=await all(s)}const setting=k=>data.settings.find(x=>x.id===k)?.value;const name=(s,id)=>data[s].find(x=>x.id===id)?.name||'—';const sum=o=>(o.items||[]).reduce((a,x)=>a+Number(x.qty||0)*Number(x.price||0),0);const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return dateLocal(x)};const dayDiff=d=>Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);const priority=o=>{if(o.ready)return {cls:'green',label:'Готово',rank:10000};let days=dayDiff(o.due);let rank=days-(o.urgent?10000:0);return {cls:days<=0?'red':days<=2?'orange':days<=5?'blue':'green',label:o.urgent?'⚡ Срочно · '+(days<0?'Просрочено':days===0?'Сегодня':days+' дн.'):(days<0?'Просрочено '+(-days)+' дн.':days===0?'Сегодня':days===1?'Завтра':days+' дн.'),rank}};const sortOrders=arr=>[...arr].sort((a,b)=>Number(a.ready)-Number(b.ready)||priority(a).rank-priority(b).rank||a.due.localeCompare(b.due));const show=(html)=>{$('#dialogBody').innerHTML=html;$('#dlg').showModal()};const close=()=>$('#dlg').close();const button=(t,fn,cls='alt')=>`<button class="btn ${cls} small" data-action="${fn}">${t}</button>`;const reportPeriod=d=>{let [y,m,day]=d.split('-').map(Number),start,end;if(day<=10){let p=new Date(y,m-2,26);start=dateLocal(p);end=`${y}-${String(m).padStart(2,'0')}-10`}else if(day<=25){start=`${y}-${String(m).padStart(2,'0')}-11`;end=`${y}-${String(m).padStart(2,'0')}-25`}else{start=`${y}-${String(m).padStart(2,'0')}-26`;let next=new Date(y,m,10);end=dateLocal(next)}return {start,end,key:end}};const periodFor=o=>o.period||reportPeriod(o.readyDate||today()).key;function periodOrders(key){return data.orders.filter(o=>o.ready&&periodFor(o)===key)};function header(t){$('#headerTitle').textContent=t;$('#addBtn').style.display=state.tab==='works'?'':'none'};function setTab(t){state.tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()};function render(){header(({works:'Мои работы',doctors:'Врачи',reports:'Отчёты',settings:'Настройки'})[state.tab]);({works:renderWorks,doctors:renderDoctors,reports:renderReports,settings:renderSettings})[state.tab]();}
function orderCard(o){let p=priority(o),items=o.items.map(x=>`${esc(name('types',x.typeId))} × ${x.qty}`).join(', ');return `<div class="card order ${p.cls} tap" data-open="${o.id}"><div class="row"><b>${esc(name('patients',o.patientId))}</b><span class="pill ${p.cls}">${p.label}</span></div><div class="sub">${esc(name('doctors',o.doctorId))} · №${esc(o.number||'')}</div><div style="margin:10px 0">${items}</div><div class="row"><span class="muted">${o.ready?'Готово '+nice(o.readyDate):'Сдача '+nice(o.due)}</span><b>${money(sum(o))}</b></div></div>`}
function renderWorks(){let active=data.orders.filter(o=>!o.ready),ready=data.orders.filter(o=>o.ready);let q=state.search.toLowerCase();let filtered=sortOrders(data.orders.filter(o=>(!state.doctor||o.doctorId===state.doctor)&&(!q||[name('patients',o.patientId),name('doctors',o.doctorId),o.note,...o.items.map(i=>name('types',i.typeId))].join(' ').toLowerCase().includes(q))));$('#app').innerHTML=`<div class="stats"><div class="card"><span class="muted">В работе</span><strong>${active.length}</strong></div><div class="card"><span class="muted">Срочные</span><strong>${active.filter(o=>dayDiff(o.due)<=2||o.urgent).length}</strong></div><div class="card"><span class="muted">Готовые</span><strong>${ready.length}</strong></div></div><div class="section"><input class="searchbar" id="search" placeholder="Поиск по пациенту, врачу, работе" value="${esc(state.search)}"><select id="doctorFilter"><option value="">Все врачи</option>${data.doctors.map(d=>`<option value="${d.id}" ${state.doctor===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>${filtered.length?filtered.map(orderCard).join(''):'<div class="empty">Заказов пока нет. Нажми «+ Заказ».</div>'}`;$('#search').oninput=e=>{state.search=e.target.value;let sel=$('#search').selectionStart;renderWorks();$('#search').focus();$('#search').setSelectionRange(sel,sel)};$('#doctorFilter').onchange=e=>{state.doctor=e.target.value;renderWorks()}}
function renderDoctors(){$('#app').innerHTML=`<div class="row"><h2>Врачи</h2>${button('+ Врач','addDoctor')}</div>${data.doctors.length?data.doctors.map(d=>{let orders=data.orders.filter(o=>o.doctorId===d.id);return `<div class="card tap" data-doctor="${d.id}"><div class="row"><b>${esc(d.name)}</b><span>›</span></div><div class="sub">Заказов: ${orders.length} · В работе: ${orders.filter(o=>!o.ready).length} · Всего: ${money(orders.reduce((a,o)=>a+sum(o),0))}</div></div>`}).join(''):'<div class="empty">Добавь первого врача</div>'}`}
function renderSettings(){$('#app').innerHTML=`<h2>Справочники</h2><div class="card"><div class="row"><b>Врачи</b>${button('+ Добавить','addDoctor')}</div>${data.doctors.map(x=>`<div class="row itemline"><span>${esc(x.name)}</span>${button('Изменить','editDoctor:'+x.id)}</div>`).join('')}</div><div class="card"><div class="row"><b>Пациенты</b>${button('+ Добавить','addPatient')}</div>${data.patients.map(x=>`<div class="row itemline"><span>${esc(x.name)}</span>${button('История','history:'+x.id)}</div>`).join('')}</div><div class="card"><div class="row"><b>Виды работ и цены</b>${button('+ Добавить','addType')}</div>${data.types.map(x=>`<div class="row itemline"><span>${esc(x.name)}<div class="sub">${money(x.price)}</div></span>${button('Изменить','editType:'+x.id)}</div>`).join('')}</div><div class="card"><div class="row"><b>Индивидуальные цены врачей</b>${button('Настроить','overrides')}</div></div><h2>Данные</h2><div class="card"><p>Все данные хранятся только в браузере этого устройства. Сохраняй резервные копии в «Файлы».</p><div class="actions">${button('Скачать резервную копию','backup','')}${button('Восстановить','restore')}</div><div class="sub">Последняя копия: ${nice(setting('lastBackup'))||'ещё не создана'}</div></div><div class="notice warning">Не очищай данные Safari и не удаляй приложение до создания резервной копии. Если используешь ФИО пациентов, обеспечь законное и безопасное обращение с персональными данными.</div>`}
function modalForm(title,body,onSave){show(`<div class="row"><h3>${title}</h3><button class="btn ghost small" data-action="close">✕</button></div><form id="modalForm">${body}<div class="actions"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" data-action="close">Отмена</button></div></form>`);$('#modalForm').onsubmit=async e=>{e.preventDefault();try{await onSave(new FormData(e.target));close();await reload();render()}catch(err){alert('Ошибка: '+err.message)}}}
function editSimple(store,id){let x=data[store].find(a=>a.id===id);modalForm(x?'Изменить':'Добавить',`<label>ФИО / название<input name="name" required value="${esc(x?.name||'')}"></label>${store==='types'?`<label>Цена, ₽<input type="number" min="0" step="0.01" name="price" value="${x?.price||0}" required></label>`:''}`,async f=>{let name=f.get('name').trim();if(!name)throw Error('Укажи название');await put(store,{id:id||uid(),name,...(store==='types'?{price:Number(f.get('price'))}:{})})})}
function history(id){let orders=sortOrders(data.orders.filter(o=>o.patientId===id));show(`<div class="row"><h3>${esc(name('patients',id))}</h3>${button('Закрыть','close')}</div>${orders.map(o=>`<div class="itemline"><b>№${esc(o.number)} · ${nice(o.received)}</b><div class="sub">${esc(name('doctors',o.doctorId))} · ${money(sum(o))} · ${o.ready?'Готово':'В работе'}</div></div>`).join('')||'<p>Заказов нет</p>'}`)}
function overrides(){show(`<div class="row"><h3>Индивидуальные цены</h3>${button('Закрыть','close')}</div><label>Врач<select id="ovDoctor">${data.doctors.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Вид работы<select id="ovType">${data.types.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Цена, ₽<input id="ovPrice" type="number" min="0" step="0.01"></label>${button('Сохранить цену','saveOverride','')}`);let update=()=>{let x=data.overrides.find(x=>x.doctorId===$('#ovDoctor').value&&x.typeId===$('#ovType').value);$('#ovPrice').value=x?.price??data.types.find(t=>t.id===$('#ovType').value)?.price??0};$('#ovDoctor').onchange=update;$('#ovType').onchange=update;update()}
function itemPrice(doctorId,typeId){return data.overrides.find(x=>x.doctorId===doctorId&&x.typeId===typeId)?.price??data.types.find(x=>x.id===typeId)?.price??0}
let editOrderId=null,orderItems=[];function openOrder(id){let o=data.orders.find(x=>x.id===id);editOrderId=id||null;orderItems=o?structuredClone(o.items):[{id:uid(),typeId:data.types[0]?.id||'',qty:1,price:0}];if(!o&&orderItems[0].typeId)orderItems[0].price=itemPrice(data.doctors[0]?.id,orderItems[0].typeId);show(`<div class="row"><h3>${o?'Заказ №'+esc(o.number):'Новый заказ'}</h3>${button('✕','close','ghost')}</div><form id="orderForm"><label>Врач<select id="oDoctor" required><option value="">Выбери врача</option>${data.doctors.map(x=>`<option value="${x.id}" ${o?.doctorId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label>Пациент<select id="oPatient" required><option value="">Выбери пациента</option>${data.patients.map(x=>`<option value="${x.id}" ${o?.patientId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="actions">${button('+ Врач','inlineDoctor')}${button('+ Пациент','inlinePatient')}</div><div id="duplicate" class="notice warning hide"></div><div class="grid2"><label>Дата получения<input id="oReceived" type="date" value="${o?.received||today()}" required></label><label>Срок сдачи<input id="oDue" type="date" value="${o?.due||addDays(today(),3)}" required></label></div><h3>Состав заказа</h3><div id="items"></div>${button('+ Вид работы','addItem')}<div class="row"><b>Итого</b><span class="total" id="oTotal"></span></div><div class="grid2"><label>Материал<input id="oMaterial" value="${esc(o?.material||'')}"></label><label>Цвет зубов<input id="oShade" value="${esc(o?.shade||'')}"></label></div><label>Примечания<textarea id="oNote" rows="2">${esc(o?.note||'')}</textarea></label><label><input id="oUrgent" type="checkbox" style="width:auto" ${o?.urgent?'checked':''}> Повысить приоритет вручную</label><label><input id="oReady" type="checkbox" style="width:auto" ${o?.ready?'checked':''}> Готово</label><div id="readyFields"><label>Фактическая дата готовности<input id="oReadyDate" type="date" value="${o?.readyDate||today()}"></label><label>Расчётный период<select id="oPeriod"></select></label><div class="sub">Можно выбрать другой период для работы, внесённой задним числом.</div></div><label><input id="oPaid" type="checkbox" style="width:auto" ${o?.paid?'checked':''}> Заказ оплачен</label><div class="actions"><button class="btn" type="submit">Сохранить заказ</button>${o?button('Удалить','deleteOrder:'+o.id,'danger'):''}</div></form>`);if(!data.doctors.length||!data.patients.length||!data.types.length){$('#orderForm').insertAdjacentHTML('afterbegin','<div class="notice warning">Для заказа нужны хотя бы один врач, пациент и вид работы. Добавь их через кнопки или «Настройки».</div>')}function refreshPeriod(){let dt=$('#oReadyDate').value||today(),p=reportPeriod(dt),keys=new Set([p.key,...data.snapshots.map(x=>x.period),...data.orders.map(x=>x.period).filter(Boolean)]);for(let i=-4;i<=4;i++){let d=new Date(dt+'T12:00:00');d.setMonth(d.getMonth()+i);keys.add(reportPeriod(dateLocal(d)).key)}$('#oPeriod').innerHTML=[...keys].sort().reverse().map(k=>`<option value="${k}" ${k===(o?.period||p.key)?'selected':''}>До ${nice(k)}</option>`).join('')};refreshPeriod();$('#oReadyDate').onchange=refreshPeriod;$('#oReady').onchange=()=>{$('#readyFields').classList.toggle('hide',!$('#oReady').checked)};$('#oReady').onchange();$('#oDoctor').onchange=()=>{if(!o){orderItems.forEach(i=>i.price=itemPrice($('#oDoctor').value,i.typeId));renderItems()}checkDup()};$('#oPatient').onchange=checkDup;function checkDup(){let found=data.orders.find(x=>x.id!==id&&!x.ready&&x.doctorId===$('#oDoctor').value&&x.patientId===$('#oPatient').value);$('#duplicate').classList.toggle('hide',!found);$('#duplicate').textContent=found?'У этого врача уже есть активный заказ для пациента (№'+found.number+'). Новый заказ всё равно можно создать.':''}checkDup();renderItems();$('#orderForm').onsubmit=saveOrder}
function renderItems(){let el=$('#items');if(!el)return;el.innerHTML=orderItems.map((i,n)=>`<div class="itemline"><div class="row"><b>Позиция ${n+1}</b>${button('Удалить','removeItem:'+i.id,'danger')}</div><label>Вид работы<select data-item="${i.id}" data-field="typeId">${data.types.map(x=>`<option value="${x.id}" ${x.id===i.typeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="grid2"><label>Количество<input data-item="${i.id}" data-field="qty" type="number" min="1" step="1" value="${i.qty}"></label><label>Цена за единицу<input data-item="${i.id}" data-field="price" type="number" min="0" step="0.01" value="${i.price}"></label></div><div class="right muted">${money(i.qty*i.price)}</div></div>`).join('');$('#oTotal').textContent=money(orderItems.reduce((a,x)=>a+x.qty*x.price,0));el.querySelectorAll('[data-item]').forEach(input=>input.onchange=()=>{let item=orderItems.find(x=>x.id===input.dataset.item),f=input.dataset.field;item[f]=f==='typeId'?input.value:Number(input.value);if(f==='typeId')item.price=itemPrice($('#oDoctor').value,item.typeId);renderItems()})}
async function saveOrder(e){e.preventDefault();if(!orderItems.length||orderItems.some(x=>!x.typeId||x.qty<1||x.price<0))return alert('Проверь позиции заказа');let o=editOrderId?data.orders.find(x=>x.id===editOrderId):null,ready=$('#oReady').checked;let newOrder={id:o?.id||uid(),number:o?.number||String(Math.max(0,...data.orders.map(x=>Number(x.number)||0))+1).padStart(4,'0'),doctorId:$('#oDoctor').value,patientId:$('#oPatient').value,received:$('#oReceived').value,due:$('#oDue').value,items:structuredClone(orderItems),material:$('#oMaterial').value,shade:$('#oShade').value,note:$('#oNote').value,urgent:$('#oUrgent').checked,ready,readyDate:ready?$('#oReadyDate').value:'',period:ready?$('#oPeriod').value:'',paid:$('#oPaid').checked,createdAt:o?.createdAt||new Date().toISOString()};if(!newOrder.doctorId||!newOrder.patientId)return alert('Выбери врача и пациента');await put('orders',newOrder);close();await reload();render()}
function periodSnapshot(key,doctorId){return data.snapshots.find(x=>x.period===key&&x.doctorId===doctorId)}function reportData(){let p=reportPeriod(state.reportDate),key=p.key;let orders=periodOrders(key).filter(o=>!state.reportDoctor||o.doctorId===state.reportDoctor);if(state.reportPaid==='paid')orders=orders.filter(o=>o.paid);if(state.reportPaid==='unpaid')orders=orders.filter(o=>!o.paid);return {p,key,orders,total:orders.reduce((a,o)=>a+sum(o),0)}}
function renderReports(){let {p,key,orders,total}=reportData(),snap=periodSnapshot(key,state.reportDoctor),allCount=orders.length;$('#app').innerHTML=`<h2>Финансы и отчёты</h2><div class="card"><label>Дата для выбора периода<input type="date" id="reportDate" value="${state.reportDate}"></label><div class="notice">Расчётный период: <b>${nice(p.start)} — ${nice(p.end)}</b></div><label>Врач<select id="reportDoctor"><option value="">Все врачи</option>${data.doctors.map(d=>`<option value="${d.id}" ${state.reportDoctor===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Оплата<select id="reportPaid"><option value="all" ${state.reportPaid==='all'?'selected':''}>Все работы</option><option value="paid" ${state.reportPaid==='paid'?'selected':''}>Оплаченные</option><option value="unpaid" ${state.reportPaid==='unpaid'?'selected':''}>Неоплаченные</option></select></label></div><div class="stats"><div class="card"><span class="muted">Заказов</span><strong>${allCount}</strong></div><div class="card"><span class="muted">Сумма</span><strong style="font-size:16px">${money(total)}</strong></div><div class="card"><span class="muted">Не оплачено</span><strong style="font-size:16px">${money(orders.filter(o=>!o.paid).reduce((a,o)=>a+sum(o),0))}</strong></div></div><div class="card"><div class="row"><b>Работы периода</b><span class="pill">${orders.length}</span></div><div style="overflow:auto"><table><thead><tr><th>Врач / пациент</th><th>Работа</th><th class="num">Кол.</th><th class="num">Цена</th><th class="num">Сумма</th></tr></thead><tbody>${orders.flatMap(o=>o.items.map(i=>`<tr><td>${esc(name('doctors',o.doctorId))}<div class="sub">${esc(name('patients',o.patientId))} · №${esc(o.number)}</div></td><td>${esc(name('types',i.typeId))}</td><td class="num">${i.qty}</td><td class="num">${money(i.price)}</td><td class="num">${money(i.qty*i.price)}</td></tr>`)).join('')}</tbody></table></div><div class="row section"><b>Итого</b><b>${money(total)}</b></div><div class="actions">${button('Скачать Word','exportDoc','')}${button('Печать / PDF','exportPdf')}${button('Отметить период оплаченным','closeReport')}</div></div>${snap?`<div class="notice">🔒 Сохранён оплаченный отчёт: ${nice(snap.closedDate)} · ${money(snap.total)}. Текущая сумма: ${money(total)}. Разница: ${money(total-snap.total)}. ${button('Скачать исходный Word','exportSnapshot')}</div>`:''}<div class="sub">Для корректировок закрытого отчёта исходная версия сохраняется. Отдельные новые записи отображаются в текущем отчёте и разнице.</div>`;$('#reportDate').onchange=e=>{state.reportDate=e.target.value;renderReports()};$('#reportDoctor').onchange=e=>{state.reportDoctor=e.target.value;renderReports()};$('#reportPaid').onchange=e=>{state.reportPaid=e.target.value;renderReports()}}
function reportRows(orders){return orders.flatMap(o=>o.items.map(i=>({doctor:name('doctors',o.doctorId),patient:name('patients',o.patientId),number:o.number,type:name('types',i.typeId),qty:i.qty,price:i.price,total:i.qty*i.price}))).sort((a,b)=>a.doctor.localeCompare(b.doctor,'ru')||a.patient.localeCompare(b.patient,'ru'))}function reportHTML(rows,key,title='Отчёт о зуботехнических работах'){let total=rows.reduce((a,r)=>a+Number(r.total),0),group='';let body=rows.map((r,i)=>{let prefix='';if(group!==r.doctor){group=r.doctor;prefix=`<tr><td colspan="6" style="background:#eef2ff;font-weight:bold">Врач: ${esc(group)}</td></tr>`}return prefix+`<tr><td>${i+1}</td><td>${esc(r.patient)} (№${esc(r.number)})</td><td>${esc(r.type)}</td><td>${r.qty}</td><td>${Number(r.price).toLocaleString('ru-RU')}</td><td>${Number(r.total).toLocaleString('ru-RU')}</td></tr>`}).join('');return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;color:#111;padding:24px}h2{font-size:20px}table{width:100%;border-collapse:collapse;font-size:11pt}td,th{border:1px solid #888;padding:6px}th{background:#e5e7eb}tfoot{font-weight:bold}@page{size:A4;margin:15mm}</style></head><body><h2>${esc(title)}</h2><p>Расчётный период до ${nice(key)}</p><table><thead><tr><th>№</th><th>Пациент / заказ</th><th>Вид работы</th><th>Кол.</th><th>Цена, ₽</th><th>Сумма, ₽</th></tr></thead><tbody>${body}</tbody><tfoot><tr><td colspan="5">ИТОГО</td><td>${total.toLocaleString('ru-RU')}</td></tr></tfoot></table><p>Дата формирования: ${nice(today())}</p></body></html>`}
function download(blob,filename){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}function crc32(bytes){let c=-1;for(let b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^-1)>>>0}function zipFiles(files){let enc=new TextEncoder(),parts=[],central=[],offset=0;const u16=n=>[n&255,(n>>>8)&255],u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];for(let [name,content] of files){let nb=enc.encode(name),bytes=enc.encode(content),crc=crc32(bytes),local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(nb.length),...u16(0),...nb]);parts.push(local,bytes);central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(bytes.length),...u32(bytes.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nb]));offset+=local.length+bytes.length}let clen=central.reduce((a,b)=>a+b.length,0);let end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(clen),...u32(offset),...u16(0)]);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}function xmlEscape(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function exportDoc(rows,key,title){const cell=t=>'<w:tc><w:p><w:r><w:t xml:space="preserve">'+xmlEscape(t)+'</w:t></w:r></w:p></w:tc>';const tr=a=>'<w:tr>'+a.map(cell).join('')+'</w:tr>';let table=tr(['№','Врач','Пациент','Работа','Кол-во','Цена, ₽','Сумма, ₽'])+rows.map((r,i)=>tr([i+1,r.doctor,r.patient+' (№'+r.number+')',r.type,r.qty,Number(r.price).toLocaleString('ru-RU'),Number(r.total).toLocaleString('ru-RU')])).join('')+tr(['','','','','','ИТОГО',rows.reduce((a,r)=>a+Number(r.total),0).toLocaleString('ru-RU')]);let para=t=>'<w:p><w:r><w:t>'+xmlEscape(t)+'</w:t></w:r></w:p>';let doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+para(title)+para('Расчётный период до '+nice(key))+ '<w:tbl><w:tblPr><w:tblBorders><w:top w:val="single"/><w:left w:val="single"/><w:bottom w:val="single"/><w:right w:val="single"/><w:insideH w:val="single"/><w:insideV w:val="single"/></w:tblBorders></w:tblPr>'+table+'</w:tbl>'+para('Дата формирования: '+nice(today()))+'<w:sectPr/></w:body></w:document>';let files=[['[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],['_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/document.xml',doc]];download(zipFiles(files),'Dental_Report_'+key+'.docx')}
function exportPrint(rows,key,title){let html=reportHTML(rows,key,title),w=window.open('','_blank');if(!w)return alert('Разреши всплывающее окно для печати');w.document.write(html);w.document.close();setTimeout(()=>w.print(),450)}
async function backup(){let payload={format:'DentalTrackerBackup',version:1,created:new Date().toISOString(),data};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`DentalTracker_backup_${today()}.json`);await put('settings',{id:'lastBackup',value:today()});await reload();render();alert('Резервная копия подготовлена. Сохрани файл в надёжном месте.')};async function restore(){let inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{let obj=JSON.parse(await inp.files[0].text());if(obj.format!=='DentalTrackerBackup'||!obj.data||!Object.keys(data).every(k=>Array.isArray(obj.data[k])))throw Error('Неверный формат копии');if(!confirm('Восстановление ЗАМЕНИТ все текущие данные. Продолжить?'))return;for(let s of Object.keys(data)){await new Promise((res,rej)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).clear();t.oncomplete=res;t.onerror=()=>rej(t.error)});for(let x of obj.data[s])await put(s,x)}await reload();render();alert('Данные восстановлены')}catch(e){alert('Не удалось восстановить: '+e.message)}};inp.click()}
async function handleAction(action){if(action==='close')return close();if(action==='addDoctor')return editSimple('doctors');if(action==='addPatient')return editSimple('patients');if(action==='addType')return editSimple('types');if(action.startsWith('editDoctor:'))return editSimple('doctors',action.split(':')[1]);if(action.startsWith('editType:'))return editSimple('types',action.split(':')[1]);if(action.startsWith('history:'))return history(action.split(':')[1]);if(action==='overrides')return overrides();if(action==='saveOverride'){let doctorId=$('#ovDoctor').value,typeId=$('#ovType').value,price=Number($('#ovPrice').value);if(!doctorId||!typeId||!Number.isFinite(price)||price<0)return alert('Проверь поля');await put('overrides',{id:doctorId+'_'+typeId,doctorId,typeId,price});await reload();close();render();return}if(action==='addItem'){orderItems.push({id:uid(),typeId:data.types[0]?.id||'',qty:1,price:itemPrice($('#oDoctor').value,data.types[0]?.id)});return renderItems()}if(action.startsWith('removeItem:')){if(orderItems.length===1)return alert('Нужна хотя бы одна позиция');orderItems=orderItems.filter(x=>x.id!==action.split(':')[1]);return renderItems()}if(action==='inlineDoctor'||action==='inlinePatient'){let n=prompt(action==='inlineDoctor'?'ФИО нового врача':'ФИО пациента');if(n?.trim()){let store=action==='inlineDoctor'?'doctors':'patients',id=uid();await put(store,{id,name:n.trim()});await reload();let select=$(action==='inlineDoctor'?'#oDoctor':'#oPatient');select.insertAdjacentHTML('beforeend',`<option value="${id}">${esc(n.trim())}</option>`);select.value=id;select.dispatchEvent(new Event('change'))}return}if(action.startsWith('deleteOrder:')){if(!confirm('Удалить заказ без возможности отмены?'))return;await del('orders',action.split(':')[1]);await reload();close();render();return}if(action==='backup')return backup();if(action==='restore')return restore();if(action==='exportDoc'||action==='exportPdf'){let {key,orders}=reportData(),rows=reportRows(orders);return action==='exportDoc'?exportDoc(rows,key,'Отчёт о зуботехнических работах'):exportPrint(rows,key,'Отчёт о зуботехнических работах')}if(action==='closeReport'){if(state.reportPaid!=='all')return alert('Выбери «Все работы» перед закрытием периода');let {key,orders,total}=reportData();if(!orders.length)return alert('Нет готовых заказов');if(!confirm('Зафиксировать оплаченный отчёт на '+money(total)+'? Все его заказы будут отмечены оплаченными.'))return;let rows=reportRows(orders),id=key+'_'+state.reportDoctor;await put('snapshots',{id,period:key,doctorId:state.reportDoctor,closedDate:today(),total,rows});for(let o of orders)await put('orders',{...o,paid:true});await reload();render();return}if(action==='exportSnapshot'){let snap=periodSnapshot(reportPeriod(state.reportDate).key,state.reportDoctor);if(snap)return exportDoc(snap.rows,snap.period,'Оплаченный отчёт (зафиксированная версия)')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action).catch(err=>alert(err.message));return}let o=e.target.closest('[data-open]');if(o)return openOrder(o.dataset.open);let d=e.target.closest('[data-doctor]');if(d){state.doctor=d.dataset.doctor;setTab('works')}});$('#addBtn').onclick=()=>openOrder();document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='works'&&state.tab!=='works')state.doctor='';setTab(b.dataset.tab)});function start(){let req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{let d=req.result;for(let s of Object.keys(data))if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};req.onsuccess=async()=>{db=req.result;await reload();render();let last=setting('lastBackup');if(!last||dayDiff(last)<-7)setTimeout(()=>{if(confirm('Резервная копия отсутствует или старше 7 дней. Скачать сейчас?'))backup()},1100)};req.onerror=()=>alert('Не удалось открыть хранилище. Проверь настройки Safari.')};start();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
